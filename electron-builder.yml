# electron-builder config: a signed macOS app for Apple silicon (arm64), written to release/ as a .dmg and a .zip.
# Build with `npm run package`; docs/releasing.md covers releases and signing. arm64 only: the Claude Agent SDK's
# bundled binary comes from a per-platform npm package (claude-agent-sdk-darwin-arm64), so an x64 build needs its
# own install. The icon is build/icon.icns; regenerate it with scripts/make-icon.sh.
appId: ai.lockhart.glade
productName: Glade
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  # The test tools' build and results (scripts/test-build.mjs, playwright.config.ts) are never packaged.
  - '!out/testing/**/*'
  - '!out/e2e-results/**/*'
  - package.json
  # The menu bar icon's glyph (src/main/menu-bar/electron.ts reads it from the app's folder).
  - assets/icon/menu-bar/*
  # node-pty (the terminal) ships prebuilt binaries for every platform, and its sources: keep only Apple silicon's.
  - '!node_modules/node-pty/prebuilds/{win32,linux,darwin-x64}*/**'
  - '!node_modules/node-pty/{deps,src,third_party,scripts,binding.gyp}'
# node-pty starts each shell through its spawn-helper executable, which must be a real file, outside the asar archive
# (node-pty looks for it in app.asar.unpacked).
asarUnpack:
  - node_modules/node-pty/prebuilds/darwin-arm64/**
  # The Agent SDK spawns Claude Code's native binary from its platform package. A spawned file must be real too, so it
  # goes in app.asar.unpacked, where sdk-backend.ts points the SDK (the SDK itself looks for it inside app.asar).
  - node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # electron-builder signs ad-hoc first (a sealed signature with no certificate), same as before #669. `afterSign`
  # (scripts/sign-mac.mjs) then re-signs with the "Glade Self-Signed" certificate when it can find exactly one, so a
  # macOS grant survives updates (docs/releasing.md); it leaves the ad-hoc signature in place otherwise. electron-
  # builder can't do this itself: it only matches a *trusted* identity, and a self-signed certificate never is.
  # Developer ID signing and notarisation are still L-04 (#69). The hardened runtime is off: it only matters for
  # notarisation, and with an ad-hoc or self-signed identity it blocks loading the unsigned native addons.
  identity: '-'
  hardenedRuntime: false
afterSign: scripts/sign-mac.mjs
# Glade-0.1.0-arm64.dmg, Glade-0.1.0-arm64.zip
artifactName: ${productName}-${version}-${arch}.${ext}
# Nothing to rebuild for Electron: better-sqlite3 and node-pty are Node-API addons with prebuilt binaries, which load
# under both Node and Electron (see src/main/db/database.ts and docs/decisions.md).
npmRebuild: false
