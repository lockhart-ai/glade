# electron-builder config: an unsigned macOS app for Apple silicon (arm64), written to release/ as a .dmg and a .zip.
# Build with `npm run package`; docs/releasing.md covers releases. arm64 only: the Claude Agent SDK's bundled binary
# comes from a per-platform npm package (claude-agent-sdk-darwin-arm64), so an x64 build needs its own install.
# The icon is build/icon.icns; regenerate it with scripts/make-icon.sh.
appId: ai.lockhart.glade
productName: Glade
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  # The test tools' build and results (scripts/test-build.mjs, playwright.config.ts) are never packaged.
  - '!out/testing/**/*'
  - '!out/e2e-results/**/*'
  - package.json
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Unsigned for now: skip looking for a signing identity.
  identity: null
# Glade-0.1.0-arm64.dmg, Glade-0.1.0-arm64.zip
artifactName: ${productName}-${version}-${arch}.${ext}
# Nothing to rebuild for Electron: better-sqlite3 is a Node-API addon with prebuilt binaries, which load under both
# Node and Electron (see src/main/db/database.ts).
npmRebuild: false
