# electron-builder config: an unsigned macOS app for the host arch, written to release/.
# Build with `npm run package`. The icon is build/icon.icns; regenerate it with scripts/make-icon.sh.
appId: ai.lockhart.glade
productName: Glade
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
mac:
  target: dir
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Unsigned for now: skip looking for a signing identity.
  identity: null
# Nothing to rebuild for Electron: better-sqlite3 is a Node-API addon with prebuilt binaries, which load under both
# Node and Electron (see src/main/db/database.ts).
npmRebuild: false
